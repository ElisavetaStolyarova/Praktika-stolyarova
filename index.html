<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Галерея</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 20px; }
    #grid img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; display: block; }
    .err  { color: #c00; }
    .busy { color: #666; }
  </style>
</head>
<body>
  <h1>Галерея</h1>
  <input type="file" id="file" accept="image/*">
  <p id="status"></p>
  <div id="grid"></div>

  <script src="app.js"></script>
</body>
</html>
